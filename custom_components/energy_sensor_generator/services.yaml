generate_sensors:
  name: Generate Energy Sensors
  description: Rebuild the generated sensors from the saved configuration (same as reloading the integration).

reset_energy_sensors:
  name: Reset Energy Sensors
  description: Scale or zero stored energy totals (useful for correcting doubled values or starting fresh).
  fields:
    sensors:
      name: Sensors
      description: Comma-separated base names to reset (e.g. the "smart_plug" in sensor.smart_plug_energy). Leave empty to reset every sensor.
      example: "smart_plug,smart_plug_4"
      selector:
        text:
    reset_factor:
      name: Reset Factor
      description: Multiply current totals by this factor (0.5 = halve, 0 = zero).
      default: 0.5
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    reset_to_zero:
      name: Reset To Zero
      description: Set totals to zero, ignoring the reset factor.
      default: false
      selector:
        boolean:

debug_sensor_detection:
  name: Debug Sensor Detection
  description: Show debug information about detected power sensors and generated energy sensors

diagnose_sensor:
  name: Diagnose Sensor
  description: Get detailed diagnostic information about a specific energy sensor
  fields:
    sensor_name:
      name: Sensor Name
      description: Name or entity ID of the energy sensor to diagnose
      required: true
      example: "smart_plug_energy"
      selector:
        text:

migrate_entity_ids:
  name: Migrate Entity IDs
  description: Fix mismatched entity IDs to match the expected pattern based on unique_id (e.g., sensor.bio_office_heaters_energy → sensor.smart_plug_energy_2)

list_sensors:
  name: List Sensors
  description: List all energy sensors created by this integration

export_energy_data:
  name: Export Energy Data
  description: Save all stored energy totals to a JSON file in the config directory.
  fields:
    target_path:
      name: Target Path
      description: File path relative to the config directory. Defaults to energy_backup_<timestamp>.json.
      example: "backups/energy_backup.json"
      selector:
        text:

import_energy_data:
  name: Import Energy Data
  description: Load energy totals from a JSON file created by Export Energy Data.
  fields:
    source_path:
      name: Source Path
      description: File path relative to the config directory.
      required: true
      example: "backups/energy_backup.json"
      selector:
        text:
    mode:
      name: Mode
      description: Merge into the current data, or replace it entirely.
      default: merge
      selector:
        select:
          options:
            - merge
            - replace
    reassign_from:
      name: Reassign From
      description: Base names in the file to rename (paired with Reassign To).
      selector:
        object:
    reassign_to:
      name: Reassign To
      description: New base names, in the same order as Reassign From.
      selector:
        object:

adjust_energy:
  name: Adjust Energy Value
  description: Adjust or correct an energy sensor value (useful for fixing spikes or errors)
  fields:
    entity_id:
      name: Entity ID
      description: The energy sensor to adjust
      required: true
      example: "sensor.smart_plug_energy"
      selector:
        entity:
          domain: sensor
          integration: energy_sensor_generator
    adjustment_kwh:
      name: Adjustment (kWh)
      description: Amount to add/subtract (use negative to reduce). Use this OR set_to_value OR copy_from_entity
      example: -1.5
      selector:
        number:
          min: -1000
          max: 1000
          step: 0.1
          unit_of_measurement: "kWh"
    set_to_value:
      name: Set to Value (kWh)
      description: Set the sensor to this exact value. Use this OR adjustment_kwh OR copy_from_entity
      example: 10.5
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          unit_of_measurement: "kWh"
    copy_from_entity:
      name: Copy from Entity
      description: Copy the value from another sensor. Use this OR adjustment_kwh OR set_to_value
      example: "sensor.other_energy"
      selector:
        entity:
          domain: sensor

copy_from_previous_hour:
  name: Copy All Sensors from Previous Hour
  description: Set all energy sensors to their values from a specific datetime (useful for fixing hourly spikes across all sensors)
  fields:
    target_datetime:
      name: Source DateTime
      description: Known-good hour to copy from (format YYYY-MM-DD HH:00:00). Provide this OR Hour To Fix.
      required: false
      example: "2025-09-30 15:00:00"
      selector:
        text:
    hour_to_fix:
      name: Hour To Fix
      description: Hour with bad readings (format YYYY-MM-DD HH:00:00). The service copies values from hours_back before this time.
      required: false
      example: "2025-09-30 16:00:00"
      selector:
        text:
    hours_back:
      name: Hours Back
      description: How many hours before "Hour To Fix" to copy from (ignored when Source DateTime is provided).
      default: 1
      selector:
        number:
          min: 1
          max: 24
          step: 1

reset_statistical_tracking:
  name: Reset Statistical Tracking
  description: Clear the statistical calculation timestamps to force fresh calculations (use if you suspect double-counting)